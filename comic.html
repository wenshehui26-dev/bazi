<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人生漫画（原型）</title>
<style>
:root{--ink:#1c2430;--paper:#eef1f5;--card:#fff;--hi:#e9b72f;--line:#c9d0da;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 "PingFang SC","Noto Sans SC",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:30px;margin:0 0 4px;letter-spacing:.04em}
.sub{margin:0 0 22px;color:#5b6675;font-size:14px}
form{background:var(--card);border:3px solid var(--ink);padding:18px;display:grid;gap:14px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:10px}
legend{font-weight:700;padding:0;margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:10px}
label{display:grid;gap:4px;font-size:13px;color:#5b6675;flex:1 1 120px}
input,select{font:inherit;color:var(--ink);padding:8px 10px;border:2px solid var(--line);background:#fff;border-radius:0;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--hi);outline-offset:1px}
.ev{display:grid;grid-template-columns:90px 1fr;gap:10px}
button{font:inherit;font-weight:700;background:var(--ink);color:#fff;border:0;padding:12px 18px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
#msg{min-height:1.7em;margin:14px 0 0;font-size:14px}
#msg.err{color:#b3261e}
h2{font-size:24px;margin:30px 0 2px}
.tag{margin:0 0 18px;color:#5b6675}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:640px){.grid{grid-template-columns:1fr}.ev{grid-template-columns:80px 1fr}}
.panel{background:var(--card);border:3px solid var(--ink);display:flex;flex-direction:column}
.art{height:170px;display:flex;align-items:center;justify-content:center;font-size:64px;position:relative;border-bottom:3px solid var(--ink)}
.art .cap{position:absolute;left:0;right:0;bottom:0;padding:5px 10px;background:rgba(28,36,48,.78);color:#fff;font-size:12px;line-height:1.4}
.age{position:absolute;top:8px;left:8px;background:var(--hi);color:var(--ink);font-weight:700;font-size:13px;padding:2px 8px;border:2px solid var(--ink)}
.body{padding:12px 14px 14px;display:grid;gap:10px}
.nar{margin:0;font-family:"Songti SC","Noto Serif SC",serif;font-size:16px;line-height:1.85}
.bub{margin:0;padding:6px 12px;border:2px solid var(--ink);border-radius:16px;background:#fff;font-size:14px;width:fit-content;max-width:100%}
.bub b{font-weight:700;margin-right:6px}
.end{margin-top:22px;padding:16px;border:3px solid var(--ink);background:var(--hi);font-family:"Songti SC","Noto Serif SC",serif;font-size:17px}
.dbg{margin-top:18px;font-size:12px;color:#5b6675;word-break:break-all}
</style>
</head>
<body>
<main>
<h1>人生漫画</h1>
<p class="sub">原型：输入生日，生成 8 格人生分镜。画面为占位图。</p>

<form id="f">
  <fieldset>
    <legend>出生信息</legend>
    <div class="row">
      <label>性别<select id="sex"><option value="1">男</option><option value="2">女</option></select></label>
      <label>年<input id="y" type="number" min="1901" max="2099" placeholder="1990" required></label>
      <label>月<input id="m" type="number" min="1" max="12" placeholder="5" required></label>
      <label>日<input id="d" type="number" min="1" max="31" placeholder="12" required></label>
      <label>时辰<select id="h">
        <option value="x">不详</option>
        <option value="0">子（23–1 点）</option><option value="2">丑（1–3 点）</option><option value="4">寅（3–5 点）</option>
        <option value="6">卯（5–7 点）</option><option value="8">辰（7–9 点）</option><option value="10">巳（9–11 点）</option>
        <option value="12">午（11–13 点）</option><option value="14">未（13–15 点）</option><option value="16">申（15–17 点）</option>
        <option value="18">酉（17–19 点）</option><option value="20">戌（19–21 点）</option><option value="22">亥（21–23 点）</option>
      </select></label>
    </div>
  </fieldset>

  <fieldset>
    <legend>你的真实情况（选填，填得越多越像你）</legend>
    <div class="row">
      <label>称呼<input id="name" maxlength="12"></label>
      <label>现在在做<input id="job" maxlength="30"></label>
      <label>老家<input id="home" maxlength="24"></label>
      <label>现居地<input id="city" maxlength="24"></label>
      <label>感情状态<input id="rel" maxlength="10" placeholder="单身 / 已婚…"></label>
    </div>
    <label>现在最烦心的事<input id="worry" maxlength="60"></label>
    <div class="ev"><input class="eY" type="number" placeholder="年份"><input class="eT" maxlength="50" placeholder="人生大事 1（一句话）"></div>
    <div class="ev"><input class="eY" type="number" placeholder="年份"><input class="eT" maxlength="50" placeholder="人生大事 2"></div>
    <div class="ev"><input class="eY" type="number" placeholder="年份"><input class="eT" maxlength="50" placeholder="人生大事 3"></div>
  </fieldset>

  <fieldset>
    <legend>管理员密钥</legend>
    <label>仅本次使用，不保存<input id="key" type="password" autocomplete="off" required></label>
  </fieldset>

  <button id="go" type="submit">生成漫画</button>
</form>
<p id="msg" role="status"></p>
<section id="out"></section>
</main>

<script>
const API = 'https://api.yizhige.top/comic';
const SCENE = {home:'🏠',countryside:'🌾',classroom:'🏫',playground:'🏃',dorm:'🛏️',train_station:'🚉',city_street:'🌆',office:'💼',night_desk:'💡',rooftop:'🌇',cafe:'☕',hospital_corridor:'🏥',family_dinner:'🍲',new_home:'🔑',seaside:'🌊',mountain_top:'⛰️',shop:'🏪',stage:'🎤'};
const MOOD = {happy:'#f6dc8a',calm:'#cfe0e8',sad:'#b9c3d6',lonely:'#c9c4dc',angry:'#e8b4a8',determined:'#f0cfa0',surprised:'#f2e3a4',tender:'#f2cdd6'};
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function say(t, err) { const m = $('msg'); m.textContent = t; m.className = err ? 'err' : ''; }

function render(data) {
  const out = $('out'); out.replaceChildren();
  const c = data.comic;
  out.append(el('h2', '', c.title), el('p', 'tag', c.tagline));
  const grid = el('div', 'grid');
  for (const p of c.panels) {
    const card = el('article', 'panel');
    const art = el('div', 'art', SCENE[p.scene_key] || '🎞️');
    art.style.background = MOOD[p.mood] || '#dde3ea';
    art.append(el('span', 'age', (p.age != null ? p.age + ' 岁' : '') + (p.stage ? ' ' + p.stage : '')), el('div', 'cap', p.scene));
    const body = el('div', 'body');
    body.append(el('p', 'nar', p.narration));
    for (const d of p.dialogue || []) {
      const b = el('p', 'bub'); b.append(el('b', '', d.who || ''), document.createTextNode(d.text)); body.append(b);
    }
    card.append(art, body); grid.append(card);
  }
  out.append(grid, el('p', 'end', c.ending));
  const dbg = data.debug || {};
  out.append(el('p', 'dbg', '排盘：' + (dbg.bazi || []).join(' ') + '　起运：' + (dbg.qiyun || '') + '　用到的事实：' + (dbg.facts_used ?? 0) + ' 项　术语命中：' + ((data.term_hits || []).join('、') || '无')));
}

$('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const hv = $('h').value;
  const events = [...document.querySelectorAll('.ev')].map((r) => ({ year: parseInt(r.querySelector('.eY').value, 10), text: r.querySelector('.eT').value.trim() })).filter((e) => e.year && e.text);
  const payload = {
    year: +$('y').value, month: +$('m').value, day: +$('d').value, sex: +$('sex').value,
    hours: hv === 'x' ? 12 : +hv, hour_unknown: hv === 'x',
    name: $('name').value.trim(),
    facts: { job: $('job').value.trim(), hometown: $('home').value.trim(), city: $('city').value.trim(), relation: $('rel').value.trim(), worry: $('worry').value.trim(), events },
  };
  $('go').disabled = true; $('out').replaceChildren();
  say('生成中，约需 30–60 秒，请不要关闭页面。');
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 150000);
  try {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Key': $('key').value }, body: JSON.stringify(payload), signal: ctl.signal });
    const raw = await res.text();
    let data; try { data = JSON.parse(raw); } catch (_) { throw new Error('返回内容不完整，请重新点击“生成漫画”。'); }
    if (res.status === 401) throw new Error('管理员密钥不正确。');
    if (!data.ok) throw new Error('生成失败：' + (data.error || res.status) + (data.detail ? '（' + data.detail + '）' : ''));
    say(''); render(data);
  } catch (e) {
    say(e.name === 'AbortError' ? '等待超过 150 秒，请重试。' : e.message, true);
  } finally { clearTimeout(timer); $('go').disabled = false; }
});
</script>
</body>
</html>
