<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人生漫画（对话版原型）</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;font:16px/1.6 "PingFang SC","Noto Sans SC",system-ui,sans-serif}
#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;overflow:hidden;display:flex;flex-direction:column;background:#111}
.bg{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity 1.2s;animation:zoom 22s ease-in-out infinite alternate}
.bg.on{opacity:1}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.09)}}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0,transparent 22%,transparent 38%,rgba(0,0,0,.88) 100%);pointer-events:none}
#msgs{position:relative;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:0 16px 12px}
.b{max-width:84%;padding:9px 14px;border-radius:16px;background:rgba(28,28,30,.72);backdrop-filter:blur(8px);font-weight:600;transition:opacity .4s;white-space:pre-wrap;word-break:break-word}
.b.me{align-self:flex-end;background:#3b82f6}
.b.typing{letter-spacing:4px;color:#aaa;align-self:flex-start}
.card{align-self:flex-start;width:88%;background:rgba(20,20,22,.74);backdrop-filter:blur(8px);border-radius:14px;padding:10px;transition:opacity .4s}
.pil{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pil div{border:1px solid #b8964a;border-radius:6px;background:#10131c;text-align:center;font:700 26px "Songti SC","Noto Serif SC",serif;color:#e9c46a;padding:6px 0}
.pil small{display:block;font:400 11px system-ui;color:#aaa}
#panel{position:relative;padding:6px 18px calc(18px + env(safe-area-inset-bottom))}
#ttl{font-size:24px;font-weight:700;line-height:1.3;margin-bottom:8px;min-height:1px;text-shadow:0 1px 8px #000}
.row{display:flex;gap:10px;align-items:center}
.row input{flex:1;min-width:0;background:transparent;border:0;border-bottom:2px solid rgba(255,255,255,.4);color:#fff;font:inherit;font-size:20px;padding:8px 2px;outline:0;border-radius:0}
.row input:focus{border-color:#fff}
::placeholder{color:rgba(255,255,255,.45)}
.pill{border:0;border-radius:999px;padding:11px 20px;background:rgba(255,255,255,.18);color:#fff;font:700 16px system-ui;backdrop-filter:blur(6px);cursor:pointer;white-space:nowrap}
.pill.main{background:#fff;color:#111}
.opts{display:grid;gap:10px;grid-template-columns:repeat(var(--c,2),1fr)}
.opts button{padding:14px 6px;border-radius:14px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font:700 16px system-ui;cursor:pointer}
.opts button.sk{border-style:dashed;grid-column:1/-1}
button:focus-visible,input:focus-visible{outline:3px solid #e9b72f;outline-offset:2px}
/* 结果页 */
#out{display:none;max-width:480px;margin:0 auto;padding:22px 14px 60px;background:#0c0d10}
body.done{overflow:auto;height:auto}
body.done #app{display:none}
body.done #out{display:block}
#out h2{font-size:26px;margin:0 0 4px}
.tag{margin:0 0 16px;color:#aab}
.panel{background:#16181d;border-radius:14px;overflow:hidden;margin-bottom:16px}
.art{position:relative;aspect-ratio:3/4;background:#222}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art .em{display:grid;place-items:center;height:100%;font-size:64px}
.age{position:absolute;top:10px;left:10px;background:#e9b72f;color:#111;font-weight:700;font-size:13px;padding:2px 10px;border-radius:999px}
.cap{position:absolute;left:0;right:0;bottom:0;padding:18px 12px 8px;background:linear-gradient(transparent,rgba(0,0,0,.8));font-size:12px;color:#ddd}
.body{padding:12px 14px 14px;display:grid;gap:10px}
.nar{margin:0;font-family:"Songti SC","Noto Serif SC",serif;font-size:17px;line-height:1.85}
.bub{margin:0;padding:6px 12px;border-radius:16px;background:#2a2d35;font-size:14px;width:fit-content;max-width:100%}
.bub b{margin-right:6px;color:#e9c46a}
.end{margin:18px 0;padding:16px;border-radius:14px;background:#e9b72f;color:#111;font-family:"Songti SC","Noto Serif SC",serif;font-size:17px}
.dbg{font-size:12px;color:#889;word-break:break-all}
#out .pill{margin-top:14px}
</style>
</head>
<body>
<div id="app">
  <div class="bg" id="bgA"></div><div class="bg" id="bgB"></div><div class="shade"></div>
  <div id="msgs"></div>
  <div id="panel"><div id="ttl"></div><div id="ctl"></div></div>
</div>
<main id="out"></main>

<script>
const API = 'https://api.yizhige.top';
const KEYS = ['home','countryside','classroom','playground','dorm','train_station','city_street','office','night_desk','rooftop','cafe','hospital_corridor','family_dinner','new_home','seaside','mountain_top','shop','stage'];
const EMOJI = {home:'🏠',countryside:'🌾',classroom:'🏫',playground:'🏃',dorm:'🛏️',train_station:'🚉',city_street:'🌆',office:'💼',night_desk:'💡',rooftop:'🌇',cafe:'☕',hospital_corridor:'🏥',family_dinner:'🍲',new_home:'🔑',seaside:'🌊',mountain_top:'⛰️',shop:'🏪',stage:'🎤'};
const SHICHEN = ['子（23–1 点）','丑（1–3 点）','寅（3–5 点）','卯（5–7 点）','辰（7–9 点）','巳（9–11 点）','午（11–13 点）','未（13–15 点）','申（15–17 点）','酉（17–19 点）','戌（19–21 点）','亥（21–23 点）'];
const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const msgs = $('msgs'), ctl = $('ctl'), ttl = $('ttl');
KEYS.forEach((k) => { new Image().src = 'scenes/' + k + '.jpg'; });

let cur = 'A';
function bg(key) {
  const next = $(cur === 'A' ? 'bgB' : 'bgA'), prev = $('bg' + cur);
  next.style.backgroundImage = 'url(scenes/' + key + '.jpg)';
  next.classList.add('on'); prev.classList.remove('on'); cur = cur === 'A' ? 'B' : 'A';
}
function fade() {
  const k = [...msgs.children];
  k.forEach((n, i) => { const d = k.length - 1 - i; n.style.opacity = d < 4 ? 1 : d === 4 ? .55 : d === 5 ? .3 : 0; n.style.display = d > 6 ? 'none' : ''; });
}
function bub(cls, text) { const d = el('div', 'b ' + cls, text); msgs.append(d); fade(); return d; }
async function say(...lines) { for (const t of lines) { const ty = bub('typing', '●●●'); await sleep(650); ty.remove(); bub('', t); await sleep(220); } }
const me = (t) => bub('me', t);
const ask = (title, build) => new Promise((res) => { ttl.textContent = title || ''; ctl.replaceChildren(); build((v) => { ctl.replaceChildren(); ttl.textContent = ''; res(v); }); });

function askText({ ttl: t, ph, btn = '告诉我', skip, pw, valid }) {
  return ask(t, (done) => {
    const f = el('form', 'row'), i = el('input'); i.placeholder = ph; if (pw) i.type = 'password'; i.autocomplete = 'off';
    const b = el('button', 'pill main', btn); b.type = 'submit'; f.append(i, b);
    f.onsubmit = (e) => { e.preventDefault(); const v = i.value.trim(); if (!v) return; if (valid && !valid(v)) { i.setCustomValidity('格式不对'); i.reportValidity(); i.setCustomValidity(''); return; } done(v); };
    ctl.append(f);
    if (skip) { const s = el('button', 'pill', skip); s.type = 'button'; s.style.marginTop = '10px'; s.onclick = () => done(''); ctl.append(s); }
    i.focus();
  });
}
function askChoice(t, opts, { cols = 2, skip } = {}) {
  return ask(t, (done) => {
    const w = el('div', 'opts'); w.style.setProperty('--c', cols);
    opts.forEach((o, k) => { const b = el('button', '', o); b.onclick = () => done({ k, o }); w.append(b); });
    if (skip) { const s = el('button', 'sk', skip); s.onclick = () => done(null); w.append(s); }
    ctl.append(w);
  });
}
async function optional(question, t, ph, max) {
  await say(question);
  const v = await askText({ ttl: t, ph, skip: '跳过' });
  me(v ? v.slice(0, max) : '跳过'); return v.slice(0, max);
}
function pillarCard(b, unk) {
  const c = el('div', 'card'), g = el('div', 'pil');
  ['年', '月', '日', '时'].forEach((l, i) => { const d = el('div', '', unk && i === 3 ? '?' : b[i]); d.append(el('small', '', l)); g.append(d); });
  c.append(g); msgs.append(c); fade();
}

function showResult(data) {
  const out = $('out'); out.replaceChildren();
  const c = data.comic;
  out.append(el('h2', '', c.title), el('p', 'tag', c.tagline));
  for (const p of c.panels) {
    const card = el('article', 'panel'), art = el('div', 'art');
    const key = EMOJI[p.scene_key] ? p.scene_key : 'city_street';
    const im = new Image(); im.alt = p.scene || ''; im.loading = 'lazy'; im.src = 'scenes/' + key + '.jpg';
    im.onerror = () => im.replaceWith(el('div', 'em', EMOJI[key]));
    art.append(im, el('span', 'age', (p.age != null ? p.age + ' 岁' : '') + (p.stage ? ' ' + p.stage : '')), el('div', 'cap', p.scene));
    const body = el('div', 'body'); body.append(el('p', 'nar', p.narration));
    for (const d of p.dialogue || []) { const b = el('p', 'bub'); b.append(el('b', '', d.who || ''), document.createTextNode(d.text)); body.append(b); }
    card.append(art, body); out.append(card);
  }
  const dbg = data.debug || {};
  const again = el('button', 'pill', '重新开始'); again.onclick = () => location.reload();
  out.append(el('p', 'end', c.ending), el('p', 'dbg', '用到的事实：' + (dbg.facts_used ?? 0) + ' 项　术语命中：' + ((data.term_hits || []).join('、') || '无')), again);
  document.body.classList.add('done'); window.scrollTo(0, 0);
}

async function main() {
  bg('home');
  await say('嗨，你来了。', '我会把你的人生，画成 8 格漫画。', '先问你几个问题，不想答的可以跳过。');
  bg('countryside'); await say('我该怎么称呼你？');
  const name = (await askText({ ttl: '我是…', ph: '你的名字或昵称' })).slice(0, 12); me(name);

  bg('classroom'); await say('好，' + name + '。', '你的生日是哪天？（公历）');
  const dv = await askText({ ttl: '我的生日是…', ph: '1990.05.12', valid: (v) => /^\d{4}[.\-\/年]\d{1,2}[.\-\/月]\d{1,2}日?$/.test(v) });
  const [y, m, d] = dv.match(/\d+/g).map(Number); me(y + '.' + m + '.' + d);

  bg('playground'); await say('你是男生还是女生？');
  const sx = await askChoice('我是…', ['男生', '女生']); me(sx.o); const sex = sx.k === 0 ? 1 : 2;

  bg('dorm'); await say('你知道自己出生的时辰吗？不知道也没关系。');
  const hc = await askChoice('我出生的时辰是…', [...SHICHEN, '不知道'], { cols: 3 });
  const hourUnknown = hc.k === 12; me(hc.o); const hours = hourUnknown ? 12 : hc.k * 2;

  bg('night_desk');
  try {
    const r = await fetch(API + '/yuanfenju', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ year: y, month: m, day: d, hours, sex }) });
    const j = await r.json();
    if (j.errcode === 0) { await say('好，我先把你的盘排出来。'); pillarCard(j.data.bazi_info.bazi, hourUnknown); await sleep(700); }
  } catch (_) {}

  bg('office'); await say('接下来，我想听你自己的经历。', '写得越具体，漫画越像你。');
  const job = await optional('你现在在做什么？', '我现在在做…', '例如：做外贸、开小店、在读书', 30);
  bg('train_station'); const home = await optional('你的老家在哪里？', '我的老家在…', '例如：河南周口', 24);
  bg('city_street'); const city = await optional('你现在住在哪个城市？', '我现在住在…', '例如：郑州', 24);

  bg('cafe'); await say('你现在的感情状态是？');
  const rc = await askChoice('我现在…', ['单身', '恋爱中', '已婚', '离异'], { skip: '不想说' });
  const relation = rc ? rc.o : ''; me(rc ? rc.o : '不想说');

  bg('family_dinner');
  const events = [];
  await say('有没有哪一年，发生了改变你人生的事？', '写“年份 + 一句话”，最多 3 件。');
  while (events.length < 3) {
    const v = await askText({ ttl: '有一年，我…', ph: '2015 考上研究生', skip: events.length ? '没有了' : '没有', valid: (t) => /^\d{4}\s*\S+/.test(t) });
    if (!v) { me(events.length ? '没有了' : '没有'); break; }
    me(v); const mm = v.match(/^(\d{4})\s*(.+)$/); events.push({ year: +mm[1], text: mm[2] });
    if (events.length < 3) await say('收到。还有吗？');
  }
  bg('rooftop'); const worry = await optional('最后一个：你现在最烦心的事是什么？', '我最烦心的是…', '一句话就行', 60);

  bg('stage'); await say('这是内部原型，需要管理员密钥才能开始画。');
  const payload = { year: y, month: m, day: d, hours, hour_unknown: hourUnknown, sex, name, facts: { job, hometown: home, city, relation, worry, events } };
  while (true) {
    const key = await askText({ ttl: '管理员密钥', ph: '不会被保存', pw: true, btn: '开始画' }); me('••••••');
    bg('seaside'); await say('我开始画了，大约 30–60 秒，请不要关闭页面。');
    const ty = bub('typing', '●●●');
    const ctlr = new AbortController(), timer = setTimeout(() => ctlr.abort(), 150000);
    try {
      const res = await fetch(API + '/comic', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Key': key }, body: JSON.stringify(payload), signal: ctlr.signal });
      const raw = await res.text(); let data; try { data = JSON.parse(raw); } catch (_) { throw new Error('返回内容不完整'); }
      if (res.status === 401) { ty.remove(); bg('stage'); await say('密钥不对，再输一次。'); continue; }
      if (!data.ok) throw new Error((data.error || res.status) + (data.detail ? '（' + data.detail + '）' : ''));
      ty.remove(); showResult(data); return;
    } catch (e) {
      ty.remove(); await say(e.name === 'AbortError' ? '等待超过 150 秒，没有返回。' : '生成失败：' + e.message + '。');
      const again = await askChoice('', ['再试一次']); me(again.o);
    } finally { clearTimeout(timer); }
  }
}
main();
</script>
</body>
</html>
