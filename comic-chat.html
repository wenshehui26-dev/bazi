<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人生漫画（对话版原型）</title>
<style>
:root{--ink:#1c2430;--paper:#eef1f5;--hi:#e9b72f;--me:#2f6fed;--bot:#fff;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:#dfe5ee;color:var(--ink);font:16px/1.65 "PingFang SC","Noto Sans SC",system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100vh;background:linear-gradient(180deg,#cfd8e6,#e9dfd0);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(255,255,255,.7);position:sticky;top:0;z-index:2}
.av{width:40px;height:40px;border-radius:50%;background:var(--ink);display:grid;place-items:center;font-size:22px}
header b{display:block;line-height:1.2}header small{color:#5b6675}
#chat{flex:1;padding:16px 14px 150px;display:flex;flex-direction:column;gap:10px}
.b{max-width:84%;padding:9px 14px;border-radius:18px;white-space:pre-wrap;word-break:break-word}
.bot{align-self:flex-start;background:var(--bot);border:2px solid var(--ink);border-bottom-left-radius:4px}
.me{align-self:flex-end;background:var(--me);color:#fff;border-bottom-right-radius:4px}
.typing{letter-spacing:3px;color:#8a94a3}
.card{align-self:flex-start;background:#fff;border:3px solid var(--ink);padding:10px 12px;width:84%}
.card h4{margin:0 0 6px;font-size:14px}
.pil{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.pil div{border:2px solid var(--ink);padding:4px 0;font-size:22px;font-weight:700}
.pil small{display:block;font-size:11px;font-weight:400;color:#5b6675}
#ctl{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.92);border-top:3px solid var(--ink);z-index:3}
#ctl>*{max-width:532px;margin:0 auto}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1 1 160px;font:inherit;padding:10px 12px;border:2px solid var(--ink);border-radius:0;min-width:0}
button{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--ink);color:#fff;padding:10px 16px;cursor:pointer}
button.ghost{background:#fff;color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--hi);outline-offset:1px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
#out{padding:0 14px 60px}
h2{font-size:24px;margin:10px 0 2px}.tag{margin:0 0 14px;color:#5b6675}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.panel{background:#fff;border:3px solid var(--ink)}
.art{height:150px;display:flex;align-items:center;justify-content:center;font-size:58px;position:relative;border-bottom:3px solid var(--ink)}
.art .cap{position:absolute;left:0;right:0;bottom:0;padding:5px 10px;background:rgba(28,36,48,.78);color:#fff;font-size:12px;line-height:1.4}
.age{position:absolute;top:8px;left:8px;background:var(--hi);font-weight:700;font-size:13px;padding:2px 8px;border:2px solid var(--ink)}
.body{padding:12px 14px;display:grid;gap:10px}
.nar{margin:0;font-family:"Songti SC","Noto Serif SC",serif;line-height:1.85}
.bub{margin:0;padding:6px 12px;border:2px solid var(--ink);border-radius:16px;font-size:14px;width:fit-content;max-width:100%}
.bub b{margin-right:6px}
.end{margin-top:16px;padding:14px;border:3px solid var(--ink);background:var(--hi);font-family:"Songti SC","Noto Serif SC",serif}
.dbg{margin-top:14px;font-size:12px;color:#5b6675;word-break:break-all}
</style>
</head>
<body>
<div id="app">
  <header><div class="av">🖋️</div><div><b>漫画师</b><small>原型 · 画面为占位图</small></div></header>
  <div id="chat"></div>
  <div id="out"></div>
</div>
<div id="ctl"></div>

<script>
const API = 'https://api.yizhige.top';
const SCENE = {home:'🏠',countryside:'🌾',classroom:'🏫',playground:'🏃',dorm:'🛏️',train_station:'🚉',city_street:'🌆',office:'💼',night_desk:'💡',rooftop:'🌇',cafe:'☕',hospital_corridor:'🏥',family_dinner:'🍲',new_home:'🔑',seaside:'🌊',mountain_top:'⛰️',shop:'🏪',stage:'🎤'};
const MOOD = {happy:'#f6dc8a',calm:'#cfe0e8',sad:'#b9c3d6',lonely:'#c9c4dc',angry:'#e8b4a8',determined:'#f0cfa0',surprised:'#f2e3a4',tender:'#f2cdd6'};
const SHICHEN = ['子（23–1 点）','丑（1–3 点）','寅（3–5 点）','卯（5–7 点）','辰（7–9 点）','巳（9–11 点）','午（11–13 点）','未（13–15 点）','申（15–17 点）','酉（17–19 点）','戌（19–21 点）','亥（21–23 点）'];
const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const chat = $('chat'), ctl = $('ctl');

function bub(cls, text) { const d = el('div', 'b ' + cls, text); chat.append(d); d.scrollIntoView({ block: 'end', behavior: 'smooth' }); return d; }
async function say(...lines) { for (const t of lines) { const ty = bub('bot typing', '●●●'); await sleep(650); ty.remove(); bub('bot', t); await sleep(200); } }
const me = (t) => bub('me', t);
const ask = (build) => new Promise((res) => { ctl.replaceChildren(); build((v) => { ctl.replaceChildren(); res(v); }); });

function askText({ ph, btn = '告诉我', skip, pw, valid }) {
  return ask((done) => {
    const f = el('form', 'row'), i = el('input'); i.placeholder = ph; if (pw) i.type = 'password'; i.autocomplete = 'off';
    const b = el('button', '', btn); b.type = 'submit'; f.append(i, b);
    if (skip) { const s = el('button', 'ghost', skip); s.type = 'button'; s.onclick = () => done(''); f.append(s); }
    f.onsubmit = (e) => { e.preventDefault(); const v = i.value.trim(); if (!v) return; if (valid && !valid(v)) { i.setCustomValidity('格式不对'); i.reportValidity(); i.setCustomValidity(''); return; } done(v); };
    ctl.append(f); i.focus();
  });
}
function askChoice(opts, skip) {
  return ask((done) => {
    const w = el('div', 'opts');
    opts.forEach((o, k) => { const b = el('button', '', o); b.onclick = () => done({ k, o }); w.append(b); });
    if (skip) { const s = el('button', 'ghost', skip); s.onclick = () => done(null); w.append(s); }
    ctl.append(w);
  });
}
// 可选问题：回答则显示在右侧气泡；跳过返回空
async function optional(question, ph, max) {
  await say(question);
  const v = await askText({ ph, skip: '跳过' });
  if (v) me(v.slice(0, max)); else me('跳过');
  return v.slice(0, max);
}

function pillarCard(b, hourUnknown) {
  const c = el('div', 'card'); c.append(el('h4', '', '你的四柱'));
  const g = el('div', 'pil');
  ['年', '月', '日', '时'].forEach((l, i) => { const d = el('div', '', (hourUnknown && i === 3) ? '—' : b[i]); d.append(el('small', '', l)); g.append(d); });
  c.append(g); chat.append(c); c.scrollIntoView({ block: 'end', behavior: 'smooth' });
}

function render(data) {
  const out = $('out'); out.replaceChildren();
  const c = data.comic;
  out.append(el('h2', '', c.title), el('p', 'tag', c.tagline));
  const grid = el('div', 'grid');
  for (const p of c.panels) {
    const card = el('article', 'panel');
    const art = el('div', 'art', SCENE[p.scene_key] || '🎞️'); art.style.background = MOOD[p.mood] || '#dde3ea';
    art.append(el('span', 'age', (p.age != null ? p.age + ' 岁' : '') + (p.stage ? ' ' + p.stage : '')), el('div', 'cap', p.scene));
    const body = el('div', 'body'); body.append(el('p', 'nar', p.narration));
    for (const d of p.dialogue || []) { const b = el('p', 'bub'); b.append(el('b', '', d.who || ''), document.createTextNode(d.text)); body.append(b); }
    card.append(art, body); grid.append(card);
  }
  const dbg = data.debug || {};
  out.append(grid, el('p', 'end', c.ending), el('p', 'dbg', '用到的事实：' + (dbg.facts_used ?? 0) + ' 项　术语命中：' + ((data.term_hits || []).join('、') || '无')));
  out.scrollIntoView({ behavior: 'smooth' });
}

async function main() {
  await say('嗨，你来了。', '我会用 8 格漫画，把你的人生画出来。先问你几个问题，每个只问一件事，不想答的可以跳过。', '我该怎么称呼你？');
  const name = (await askText({ ph: '你的名字或昵称' })).slice(0, 12); me(name);

  await say('好，' + name + '。', '你的生日是哪天？（公历，例如 1990.05.12）');
  let y, m, d;
  const dv = await askText({ ph: '1990.05.12', valid: (v) => /^\d{4}[.\-\/年]\d{1,2}[.\-\/月]\d{1,2}日?$/.test(v) });
  [y, m, d] = dv.match(/\d+/g).map(Number); me(y + '.' + m + '.' + d);

  await say('你是男生还是女生？');
  const sx = await askChoice(['男', '女']); me(sx.o); const sex = sx.k === 0 ? 1 : 2;

  await say('你知道自己出生的时辰吗？不知道也没关系。');
  const hc = await askChoice([...SHICHEN, '不知道']);
  const hourUnknown = hc.k === 12; me(hc.o);
  const hours = hourUnknown ? 12 : hc.k * 2;

  try {
    const r = await fetch(API + '/yuanfenju', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ year: y, month: m, day: d, hours, sex }) });
    const j = await r.json(); if (j.errcode === 0) { await say('好，我先把你的盘排出来。'); pillarCard(j.data.bazi_info.bazi, hourUnknown); await sleep(600); }
  } catch (_) {}

  await say('接下来我想听你自己的经历。写得越具体，漫画越像你。');
  const job = await optional('你现在在做什么？', '例如：做外贸、开小店、在读书', 30);
  const home = await optional('你的老家在哪里？', '例如：河南周口', 24);
  const city = await optional('你现在住在哪个城市？', '例如：郑州', 24);

  await say('你现在的感情状态是？');
  const rc = await askChoice(['单身', '恋爱中', '已婚', '离异'], '不想说'); const relation = rc ? rc.o : ''; me(rc ? rc.o : '不想说');

  const events = [];
  await say('有没有哪一年，发生了改变你人生的事？写“年份 + 一句话”，最多 3 件。');
  while (events.length < 3) {
    const v = await askText({ ph: '例如：2015 考上研究生', skip: events.length ? '没有了' : '没有', valid: (t) => /^\d{4}\s*\S+/.test(t) });
    if (!v) { me(events.length ? '没有了' : '没有'); break; }
    me(v); const mm = v.match(/^(\d{4})\s*(.+)$/); events.push({ year: +mm[1], text: mm[2] });
    if (events.length < 3) { await say('收到。还有吗？'); } 
  }
  const worry = await optional('最后一个：你现在最烦心的事是什么？', '一句话就行', 60);

  await say('这是内部原型，需要管理员密钥才能生成。');
  const payload = { year: y, month: m, day: d, hours, hour_unknown: hourUnknown, sex, name, facts: { job, hometown: home, city, relation, worry, events } };
  while (true) {
    const key = await askText({ ph: '管理员密钥（不保存）', pw: true, btn: '开始画' }); me('••••••');
    await say('我开始画了，大约 30–60 秒，请不要关闭页面。');
    const ctlr = new AbortController(); const timer = setTimeout(() => ctlr.abort(), 150000);
    try {
      const res = await fetch(API + '/comic', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Key': key }, body: JSON.stringify(payload), signal: ctlr.signal });
      const raw = await res.text(); let data; try { data = JSON.parse(raw); } catch (_) { throw new Error('返回内容不完整'); }
      if (res.status === 401) { await say('密钥不对，再输一次。'); continue; }
      if (!data.ok) throw new Error((data.error || res.status) + (data.detail ? '（' + data.detail + '）' : ''));
      await say('画好了，' + name + '。往下看。'); render(data); ctl.replaceChildren(); return;
    } catch (e) {
      await say(e.name === 'AbortError' ? '等待超过 150 秒，没有返回。' : '生成失败：' + e.message + '。再试一次？');
      const again = await askChoice(['再试一次']); me(again.o);
    } finally { clearTimeout(timer); }
  }
}
main();
</script>
</body>
</html>
